<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Editor de mapa · Capture it like a pro</title>
<style>
:root{
  --body:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono:'Cascadia Mono', Consolas, 'SF Mono', 'Roboto Mono', monospace;
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;font-family:var(--body);overflow:hidden}

.app{
  --bg:#050505;
  --surface:#101010;
  --surface-2:#181818;
  --line:#262626;
  --text:#f2f2f2;
  --muted:#7e7e7e;
  --accent:#3da9ff;
  --accent-glow:rgba(61,169,255,.30);
  /* color por sección (tabs) */
  --c-estructura:#3da9ff;
  --c-elementos:#c6ff00;
  --c-camaras:#ffd60a;
  /* colores por tipo de elemento */
  --c-acceso:#c6ff00;
  --c-bano:#2dd4bf;
  --c-columna:#9a9a9a;
  --c-cam:#ffd60a;
  --c-dj:#c46bff;
  --c-bar:#3da9ff;
  --c-esc:#ff9f0a;
  --c-gen:#f2f2f2;
  /* colores de elementos de EXTERIOR */
  --c-arbol:#5fbf57;
  --c-agua:#3da9ff;
  --c-fuente:#2dd4bf;
  --c-comida:#ff9f0a;
  --c-edificio:#9aa0a6;
  --c-metro:#ff5a4d;
  --c-carretera:#8a8f96;
  --c-iglesia:#d9b65d;
  --c-monumento:#b8b3a8;
  --c-arbusto:#4e9e4a;
  --c-banco:#9c7b50;
  --c-pino:#2f7d3a;
  --c-palmera:#3f9e47;

  position:relative;
  width:100%;max-width:430px;height:100dvh;margin:0 auto;
  background:var(--bg);color:var(--text);
  overflow:hidden;
  display:flex;flex-direction:column;
}
.app::before{
  content:'';position:absolute;inset:0;
  background-color:var(--accent);opacity:.12;
  -webkit-mask-image:radial-gradient(120% 46% at 50% -8%, #000, transparent 62%);
  mask-image:radial-gradient(120% 46% at 50% -8%, #000, transparent 62%);
  pointer-events:none;
}
@media (min-width:768px){
  body{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .app{height:min(844px,94vh);border:1px solid #262626;border-radius:28px;box-shadow:0 40px 120px rgba(0,0,0,.7)}
}

/* ───────────── CABECERA (con la barra de acciones) ───────────── */
header{
  position:relative;z-index:2;
  padding:calc(12px + env(safe-area-inset-top)) 14px 8px;
  display:flex;align-items:center;gap:5px;
}
header h1{
  flex:1;min-width:0;
  font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
header h1::before{content:'● ';color:var(--accent);font-size:8px;vertical-align:2px}
.hd-btn{
  flex:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:12px;letter-spacing:.06em;
  padding:7px 9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
}
.hd-btn.ic{width:30px;height:30px;padding:0}
.hd-btn.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hd-btn:active{transform:scale(.94)}
.hd-btn:disabled{opacity:.3;cursor:default}
.hd-btn#btn-save{color:var(--accent);border-color:rgba(61,169,255,.45)}
.hd-btn#btn-clear{color:#ff6a60}
.hd-sep{width:1px;height:20px;background:var(--line);flex:none;margin:0 1px}

.name-row{position:relative;z-index:2;padding:0 18px 8px}
.name-row input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--mono);font-size:13px;letter-spacing:.05em;
  padding:8px 12px;outline:none;
}
.name-row input:focus{border-color:var(--accent)}
.name-row input::placeholder{color:var(--muted)}

/* ───────────── SECCIONES (tabs) ───────────── */
.tabs{
  position:relative;z-index:2;
  display:flex;gap:6px;padding:0 18px 8px;
}
.tab{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  color:var(--muted);font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  padding:9px 4px;cursor:pointer;
  transition:border-color .2s,color .2s,box-shadow .2s;
}
.tab svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab .num{
  width:14px;height:14px;border-radius:50%;border:1px solid currentColor;
  display:flex;align-items:center;justify-content:center;font-size:8px;flex:none;
}
.tab[data-tab="estructura"].is-on{color:var(--c-estructura);border-color:var(--c-estructura);box-shadow:0 0 16px rgba(61,169,255,.30)}
.tab[data-tab="elementos"].is-on{color:var(--c-elementos);border-color:var(--c-elementos);box-shadow:0 0 16px rgba(198,255,0,.30)}
.tab[data-tab="camaras"].is-on{color:var(--c-camaras);border-color:var(--c-camaras);box-shadow:0 0 16px rgba(255,214,10,.30)}

/* ───────────── LIENZO ───────────── */
/* cuadrado y centrado → proporciones reales (un cuadrado se ve cuadrado,
   el semicírculo es medio círculo de verdad). El tamaño px lo fija el JS. */
/* lienzo ANCLADO bajo las pestañas (alto = el del lienzo, sin huecos variables);
   el espacio sobrante va al fondo de .below */
.canvas-wrap{position:relative;z-index:1;flex:0 0 auto;padding:6px 18px 0;display:flex;justify-content:center}
/* paneles de abajo: absorben el espacio sobrante y hacen scroll si no caben */
.below{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.below::-webkit-scrollbar{width:0;height:0}
#canvas{
  position:relative;width:100%;height:100%;flex:none;
  background:var(--surface);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:11.11% 11.11%;
  border:1px solid var(--line);border-radius:14px;
  overflow:hidden;touch-action:none;
}
#canvas.no-grid{background-image:none}
/* sobre un fondo claro (papel/arena) la rejilla oscura canta demasiado → líneas tenues */
#canvas.light-bg:not(.no-grid){
  background-image:
    linear-gradient(rgba(0,0,0,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.09) 1px, transparent 1px);
}
#floor{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* unión SIN costuras: capa inferior de "blobs" en color de acento (relleno+trazo)
   y, encima, los rellenos opacos exactos. Como cada capa es de un solo color, las
   piezas que se solapan se fusionan sin línea interior; solo asoma el contorno de
   acento en el perímetro exterior de la unión. */
#floor .glowg{filter:drop-shadow(0 0 7px var(--accent-glow))}
/* el COLOR (relleno+trazo) va por atributo en cada path → cada pieza puede llevar
   el suyo (asfalto, agua, jardín…). Las reglas CSS de aquí solo fijan geometría;
   .snap (regla CSS) gana al atributo y pinta el borde imantado en amarillo. */
#floor .pglow{stroke-width:5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
/* al imantar un borde con otra pieza, ese contorno se pinta en amarillo */
#floor .pglow.snap{fill:#ffd60a;stroke:#ffd60a}
#floor .glowg.snapping{filter:drop-shadow(0 0 8px rgba(255,214,10,.55))}
/* pieza demasiado fuera del lienzo (>90%): aviso en ROJO mientras se arrastra */
#floor .pfl.too-far,#floor .pglow.too-far{fill:#ff3b30;stroke:#ff3b30}
/* el relleno lleva un trazo del MISMO color: así dos rellenos que se tocan se
   solapan ~1px y tapan el acento de debajo (no queda raya en la costura).
   Piezas del MISMO color se fusionan sin costura; distinto color = se superponen. */
#floor .pfl{stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:auto;cursor:grab}
#floor .psel{fill:none;stroke:#fff;stroke-width:1.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;pointer-events:none}
/* decoración sobre las piezas (según su color): líneas viales, olas o flores */
#floor .decor{pointer-events:none}
/* carretera: bordes continuos + eje central discontinuo (blanco) */
#floor .rm-solid{fill:none;stroke:#f4f4f4;stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.92}
#floor .rm-dash{fill:none;stroke:#f4f4f4;stroke-width:1.3;stroke-dasharray:4 5;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.92}
/* agua: olas claras y sutiles */
#floor .dec-wave{fill:none;stroke:#d4ecff;stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.6}
/* escalera / grada: peldaños */
#floor .step-line{fill:none;stroke:rgba(0,0,0,.42);stroke-width:1;vector-effect:non-scaling-stroke}
#floor .step-grada{stroke:rgba(0,0,0,.55);stroke-width:1.5}
/* pistas deportivas: líneas blancas */
#floor .court-line{fill:none;stroke:#f4f4f4;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.92;stroke-linejoin:round}
/* jardín: matas de hierba (briznas verdes) + alguna florecilla diminuta */
#floor .dec-grass{fill:#4ea63f;stroke:#1d5523;stroke-width:.45;vector-effect:non-scaling-stroke;stroke-linejoin:round;opacity:.95}
#floor .dec-petal{fill:#ff9ec4;opacity:.85}
#floor .dec-core{fill:#ffe15a;opacity:.92}

/* elementos colocados — tamaño libre vía --w/--h, centrados en su punto (x,y) */
.el{
  position:absolute;
  width:var(--w,30px);height:var(--h,30px);
  transform:translate(-50%,-50%);
  cursor:grab;touch-action:none;user-select:none;
  color:var(--el-c);
}
.el:active{cursor:grabbing}
/* INTERIOR (estilo original): recuadro oscuro con borde del color, icono trazado
   (con tope) y etiqueta DEBAJO en el color del elemento */
.el .ic{
  position:relative;
  width:100%;height:100%;border-radius:9px;
  background:var(--surface-2);border:1.5px solid var(--el-c);
  display:flex;align-items:center;justify-content:center;
  transform:rotate(var(--rot,0deg));
  transition:transform .15s var(--ease);
}
.el .ic svg{width:60%;height:60%;max-width:22px;max-height:22px;display:block;stroke:var(--el-c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.el .lb{
  position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;
  font-family:var(--mono);font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--el-c);opacity:.85;pointer-events:none;max-width:96px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* EXTERIOR: MISMO aspecto que el interior (el que gustaba: recuadro oscuro + borde e
   icono del color, etiqueta debajo con su fuente y color originales). Mejoras añadidas:
   el icono ESCALA con el recuadro (sin tope, CONSERVANDO proporción → no se achata),
   sombra suave para que el chip resalte en el mapa, y un halo sutil en el texto para
   que se lea sobre cualquier fondo (sin borde negro duro). */
/* PIN BLANCO tipo mapa: chip blanco redondeado SIN borde, sombra suave, icono de color
   (con un filo oscuro fino para que los iconos claros se distingan sobre el blanco);
   etiqueta debajo con su color y un halo para leerse sobre el fondo del mapa. */
.mode-ext .el .ic{
  background:rgba(255,255,255,.96);
  border:none;border-radius:12px;
  box-shadow:0 2px 7px rgba(0,0,0,.32);
}
.mode-ext .el .ic svg{width:62%;height:62%;max-width:none;max-height:none;filter:drop-shadow(0 0 .5px rgba(0,0,0,.4))}
/* etiqueta en su color original sobre una pastilla oscura → legible en cualquier fondo */
.mode-ext .el .lb{background:rgba(20,20,20,.62);border-radius:4px;padding:0 4px;text-shadow:none;opacity:1}
/* SILUETAS (árbol/arbusto/banco): sin recuadro, icono RELLENO del color (con filo oscuro) */
.mode-ext .el.sil .ic{background:none;border:none;box-shadow:none}
.mode-ext .el.sil .ic svg{width:96%;height:96%;fill:var(--el-c);stroke:rgba(0,0,0,.34);stroke-width:.7;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
/* INTERIOR: el fondo del mapa no se puede editar */
.mode-int #bg-btn{display:none}
.el.t-columna .ic{border-radius:50%}
.el.t-gen_circulo .ic{border-radius:50%}
.el.t-escenario .ic,.el.t-bar .ic,.el.t-agua .ic,.el.t-carretera .ic,.el.t-comida .ic{border-radius:6px}
/* cámara: baliza roja parpadeante para localizarla de un vistazo */
.el.t-camarografo .ic{animation:camHalo 1.4s ease-in-out infinite}
@keyframes camHalo{
  0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}
  50%{box-shadow:0 0 16px 5px rgba(255,59,48,.8)}
}
.el.t-camarografo .ic::after{
  content:'';position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;
  background:#ff3b30;box-shadow:0 0 6px rgba(255,59,48,.9);
  animation:camDot 1.4s steps(2,jump-none) infinite;
}
@keyframes camDot{0%,49%{opacity:1}50%,100%{opacity:.12}}
.el.sel .ic{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--el-c),0 0 16px var(--el-c)}
/* alcance de edición por sección: solo se puede tocar lo de la pestaña activa */
.app.sec-estructura .el{pointer-events:none}
.app.sec-elementos #floor .pfl{pointer-events:none}
.app.sec-elementos .el.t-camarografo{pointer-events:none}
.app.sec-camaras #floor .pfl{pointer-events:none}
.app.sec-camaras .el{pointer-events:none}
.app.sec-camaras .el.t-camarografo{pointer-events:auto}
/* mostrar/ocultar elementos (botón de la sección Estructura) */
#canvas.hide-els .el{display:none}
/* candado en elementos con posición bloqueada */
.el .lock-badge{
  position:absolute;top:-8px;right:-8px;z-index:6;
  width:16px;height:16px;border-radius:50%;
  background:#ffd60a;border:1.5px solid var(--bg);
  display:none;align-items:center;justify-content:center;
  box-shadow:0 0 7px rgba(255,214,10,.6);
}
.el .lock-badge svg{width:9px;height:9px;stroke:#1a1500;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.el.locked .lock-badge{display:flex}
.el.dragging{opacity:.85;z-index:10}

/* fantasma al arrastrar desde la paleta */
#ghost{
  position:fixed;z-index:99;width:44px;height:44px;margin:-22px 0 0 -22px;
  pointer-events:none;display:none;opacity:.9;
}

/* aviso flotante (dentro del mapa, arriba) */
#toast{
  position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-8px);
  background:var(--surface-2);border:1px solid var(--accent);border-radius:10px;
  color:var(--text);font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  padding:9px 16px;opacity:0;pointer-events:none;z-index:30;
  transition:opacity .25s var(--ease),transform .25s var(--ease);
  white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* barra de deshacer — dentro del mapa, abajo, bien visible */
#undobar{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(10px);
  display:flex;align-items:center;gap:12px;
  background:rgba(18,18,18,.97);border:1.5px solid var(--accent);border-radius:12px;
  padding:9px 9px 9px 16px;
  box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 18px var(--accent-glow);
  opacity:0;pointer-events:none;z-index:31;
  transition:opacity .22s var(--ease),transform .22s var(--ease);
  white-space:nowrap;touch-action:none;
}
#undobar.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#undobar-txt{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--text)}
#undobar-btn{
  background:var(--accent);border:none;border-radius:8px;
  color:#04121f;font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;cursor:pointer;
}
#undobar-btn:active{transform:scale(.95)}

/* ───────────── PANEL DE EDICIÓN (sección separada) ───────────── */
/* siempre presente y de altura fija → el mapa no cambia de tamaño al usarlo */
.edit-panel{
  position:relative;z-index:2;
  margin:9px 18px 0;
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:82px;
  background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:12px;
  padding:8px 12px;
}
/* izquierda (forma) + centro (joystick) agrupados; deshacer/rehacer SIEMPRE a la derecha */
.ep-tools{display:flex;align-items:center;gap:14px;min-width:0}
.ep-hint{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.02em;line-height:1.35;max-width:205px}
.edit-panel:not(.is-hint) .ep-hint{display:none}
.edit-panel.is-hint .ep-left,
.edit-panel.is-hint .ep-joy{display:none}
/* IZQUIERDA: fila1 [agrandar][reducir] · fila2 [girar] centrado */
.ep-left{display:grid;grid-template-columns:repeat(2,30px);grid-template-rows:repeat(2,30px);gap:5px}
#btn-bigger{grid-area:1/1}
#btn-smaller{grid-area:1/2}
.ep-rot{grid-area:2/1/3/3;justify-self:center}
/* CENTRO: joystick (arriba/abajo pegadas, izq/dcha centradas) */
.ep-joy{display:grid;grid-template-columns:repeat(3,30px);grid-template-rows:repeat(2,30px);gap:3px}
.joy-up{grid-area:1/2/2/3}
.joy-down{grid-area:2/2/3/3}
.joy-left{grid-area:1/1/3/2;align-self:center}
.joy-right{grid-area:1/3/3/4;align-self:center}
/* DERECHA: rejilla 3×2 (3 columnas × 2 filas), una categoría por columna →
   col1 [deshacer/rehacer] · col2 [texto/duplicar] · col3 [bloquear/borrar].
   Posición FIJA por grid-area: si "texto" no aplica (piezas / elementos no editables)
   su celda queda vacía sin recolocar el resto. */
.ep-right{display:grid;grid-template-columns:repeat(3,30px);gap:5px;flex:none;align-content:center}
#btn-undo{grid-area:1/1}
#btn-redo{grid-area:2/1}
#btn-text,#btn-color{grid-area:1/2}   /* texto (elementos) y color (piezas) comparten celda */
#btn-dup{grid-area:2/2}
#btn-lock{grid-area:1/3}
#btn-del{grid-area:2/3}
.edit-panel button{
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  color:var(--text);cursor:pointer;display:none;flex:none;
  width:30px;height:30px;align-items:center;justify-content:center;padding:0;
}
.edit-panel button.on{display:flex}
.edit-panel button:active{transform:scale(.93)}
.edit-panel button:disabled{opacity:.28;cursor:default}
.edit-panel button svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edit-panel .c-size{color:#6fd3e6;border-color:#235862}
#btn-undo,#btn-redo{color:#cfd6db}
.edit-panel .c-text{color:#3da9ff;border-color:rgba(61,169,255,.4)}
.edit-panel .c-color{color:#c46bff;border-color:rgba(196,107,255,.4)}
.edit-panel .c-dup{color:#c6ff00;border-color:rgba(198,255,0,.4)}
.edit-panel .c-lock{color:#7e7e7e}
.edit-panel .c-lock.is-locked{color:#ffd60a;border-color:rgba(255,214,10,.5);background:rgba(255,214,10,.1)}
.edit-panel .c-del{color:#ff3b30;border-color:rgba(255,59,48,.4)}

/* ───────────── CUERPO DE LA SECCIÓN ACTIVA ───────────── */
/* min-height fija (≥ la sección más alta) → el lienzo no cambia entre pestañas */
.tab-body{position:relative;z-index:2;padding:8px 18px calc(8px + env(safe-area-inset-bottom));min-height:120px}
.tab-pane{display:flex;flex-direction:column;gap:6px}
.tab-pane.hidden{display:none}
.pane-hint{
  font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.04em;
  text-align:center;padding-top:1px;line-height:1.4;
}

/* piezas de estructura */
.shapes{display:flex;gap:8px}
.shape-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:7px 2px 5px;cursor:pointer;color:var(--muted);
  transition:border-color .2s,color .2s;
}
.shape-btn svg{width:24px;height:24px;display:block}
.shape-btn svg .fl{fill:none;stroke:currentColor;stroke-width:7}
.shape-btn span{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase}
.shape-btn:active{border-color:var(--c-estructura);color:var(--c-estructura)}
/* exterior: más piezas (carretera/camino/agua/jardín) → rejilla de 4, etiqueta a 2 líneas */
.shapes.ext{display:grid;grid-template-columns:repeat(4,1fr)}
.shapes.ext .shape-btn span{white-space:normal;line-height:1.05;text-align:center}
/* exterior sin nombres: solo la forma, icono algo mayor y botón compacto */
.shapes.noname .shape-btn{padding:12px 2px}
.shapes.noname .shape-btn svg{width:30px;height:30px}
/* panel de orden/navegación de formas (solo exterior · Estructura) */
.piece-nav{display:flex;align-items:stretch;justify-content:center;gap:8px;margin-bottom:7px}
.piece-nav .pn-group{display:flex;gap:5px}
.piece-nav .pn-sep{width:1px;background:var(--line);margin:3px 2px}
.piece-nav button{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  color:var(--text);cursor:pointer;padding:5px 10px;
}
.piece-nav button:active{transform:scale(.95)}
.piece-nav button:disabled{opacity:.3;cursor:default}
.piece-nav button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.piece-nav button span{font-family:var(--mono);font-size:7px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
/* botón mostrar/ocultar todos los elementos (sección Estructura) */
.vis-toggle{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  padding:9px 0;cursor:pointer;
  transition:color .2s,border-color .2s;
}
.vis-toggle svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vis-toggle:active{transform:scale(.98)}
.vis-toggle.off{color:var(--muted);border-style:dashed}
/* fila Estructura: ocultar elementos + grid + color de fondo — los tres en UNA línea */
.struct-row{display:flex;gap:6px;flex-wrap:nowrap}
.struct-row .vis-toggle{font-size:8.5px;letter-spacing:.02em;gap:5px;padding:8px 9px;white-space:nowrap}
.struct-row .vis-toggle svg{width:13px;height:13px}
.struct-row #vis-toggle{flex:1 1 auto;min-width:0}
.struct-row #grid-btn,.struct-row #bg-btn{flex:0 0 auto}
.bg-sw{width:14px;height:14px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface-2);flex:none}

/* paleta de elementos / cámara — COMPACTA: chips horizontales (~mitad de alto) */
.el-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pal-item{
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:5px;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:5px 4px;cursor:grab;touch-action:none;user-select:none;
  color:var(--pal-c);
}
.pal-item:active{cursor:grabbing}
.pal-item .ic{
  width:20px;height:20px;border-radius:6px;flex:none;
  background:var(--surface-2);border:1.5px solid var(--pal-c);
  display:flex;align-items:center;justify-content:center;
}
.pal-item[data-type="columna"] .ic,
.pal-item[data-type="gen_circulo"] .ic{border-radius:50%}
.pal-item .ic svg{width:12px;height:12px;stroke:var(--pal-c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pal-item span{font-family:var(--mono);font-size:7.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--pal-c)}

/* exterior: 2 secciones (siluetas / elementos), 3 ejemplos + «+» por fila */
.el-sec{margin-bottom:7px}
.el-sec-lbl{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.el-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pal-item.add-more{color:var(--accent);border-style:dashed;cursor:pointer}
.pal-item.add-more .ic{border-color:var(--accent)}
.pal-item.add-more .ic svg{stroke:var(--accent)}
.pal-item.add-more span{color:var(--accent)}
/* submenú «+»: OVERLAY anclado abajo, POR ENCIMA de los paneles de botones.
   Se queda abierto al colocar; se cierra con ✕. */
.el-more{
  display:none;position:absolute;left:14px;right:14px;bottom:12px;z-index:55;
  max-height:62%;overflow-y:auto;
  background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;
  box-shadow:0 10px 34px rgba(0,0,0,.55);
}
.el-more.open{display:block}
.el-more-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.el-more-head span{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.el-more-x{background:none;border:none;color:var(--muted);font-size:14px;line-height:1;cursor:pointer;padding:2px 6px}
.el-more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

/* subsección "Otros" (figuras genéricas sin texto) */
.otros{display:flex;align-items:center;gap:9px;margin-top:1px;padding-top:6px;border-top:1px solid var(--line)}
.otros-lbl{flex:none;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.otros-row{display:flex;gap:6px;flex:1}
.pal-item.icon-only{flex:none;width:34px;padding:5px 0;justify-content:center}

/* cámara: botón ancho destacado */
.pal-item.cam-big{gap:9px;padding:8px 2px}
.pal-item.cam-big .ic{width:24px;height:24px}
.pal-item.cam-big .ic svg{width:15px;height:15px}
.pal-item.cam-big span{font-size:10px;letter-spacing:.06em}

/* ───────────── BARRA DE ACCIONES (compacta) ───────────── */
.toolbar{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:8px;
  padding:5px 18px calc(8px + env(safe-area-inset-bottom));
}
.toolbar .tb-spacer{flex:1}
.toolbar button{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  color:var(--text);cursor:pointer;font-family:var(--mono);
}
.toolbar button:active{transform:scale(.96)}
.toolbar button:disabled{opacity:.32;cursor:default}
.toolbar .tb-icon{width:34px;height:30px;display:flex;align-items:center;justify-content:center;padding:0}
.toolbar .tb-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toolbar .tb-txt{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:8px 16px}
.toolbar #btn-save{border-color:var(--accent);color:var(--accent)}
.toolbar #btn-clear{color:var(--muted)}

/* ───────────── PANEL MIS MAPAS ───────────── */
#maps-panel{
  position:absolute;inset:0;z-index:60;
  background:rgba(0,0,0,.6);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease);
}
#maps-panel.open{opacity:1;pointer-events:auto}
#maps-panel .sheet{
  width:100%;max-height:70%;overflow:auto;
  background:var(--bg);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;
  padding:14px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(12px);transition:transform .2s var(--ease);
}
#maps-panel.open .sheet{transform:translateY(0)}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--text);
  text-transform:uppercase;padding-bottom:10px;
}
.sheet-head button{
  background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:4px 8px;
}
.map-row{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;margin-bottom:8px;cursor:pointer;
}
.map-row.current{border-color:var(--accent)}
.map-row .mn{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-row .md{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.05em}
.map-row .mx{background:none;border:none;color:#ff3b30;font-size:13px;cursor:pointer;padding:4px 6px}
#maps-new{
  width:100%;background:var(--surface);border:1px dashed var(--line);border-radius:11px;
  color:var(--accent);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;padding:11px 0;cursor:pointer;margin-top:2px;
}
.maps-empty{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;padding:6px 2px 10px}

/* ───────────── MODAL DE TEXTO (sustituye al prompt del SO) ───────────── */
#text-modal{
  position:absolute;inset:0;z-index:70;
  background:rgba(0,0,0,.62);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .18s var(--ease);
}
#text-modal.open{opacity:1;pointer-events:auto}
.modal-card{
  width:100%;max-width:320px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:18px 16px 14px;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02) inset;
  transform:translateY(10px) scale(.98);transition:transform .18s var(--ease);
}
#text-modal.open .modal-card{transform:none}
.modal-title{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;
}
#tm-input{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--body);font-size:15px;
  padding:11px 13px;outline:none;
}
#tm-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-btn{
  flex:1;border-radius:10px;padding:11px 0;cursor:pointer;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);
}
.modal-btn:active{transform:scale(.97)}
.modal-btn.ghost{background:var(--surface-2);color:var(--muted)}
.modal-btn.primary{background:var(--accent);color:#04121f;border-color:var(--accent)}

/* ───────────── HOJA DE COLOR (pieza o fondo) ───────────── */
#color-sheet{
  position:absolute;inset:0;z-index:65;
  background:rgba(0,0,0,.6);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease);
}
#color-sheet.open{opacity:1;pointer-events:auto}
#color-sheet .sheet{
  width:100%;background:var(--bg);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;
  padding:14px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(12px);transition:transform .2s var(--ease);
}
#color-sheet.open .sheet{transform:translateY(0)}
.cs-swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:4px 0 12px}
.cs-sw{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:none;cursor:pointer;color:var(--muted);
}
.cs-sw .chip{
  width:100%;aspect-ratio:1;border-radius:11px;border:2px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.cs-sw.on .chip{border-color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.cs-sw span{font-family:var(--mono);font-size:7.5px;letter-spacing:.04em;text-transform:uppercase;text-align:center;line-height:1.1}
.cs-palette{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:11px 14px;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text);
}
.cs-palette:active{transform:scale(.99)}
.cs-pal-ico{
  width:22px;height:22px;border-radius:6px;flex:none;border:1.5px solid var(--line);
  background:conic-gradient(from 90deg, #ff0040, #ffd000, #25e36b, #00c2ff, #6b4dff, #ff36c8, #ff0040);
}
/* el <input type=color> queda invisible pero clicable por programa (abre la paleta del SO) */
.cs-hidden-input{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:none;padding:0;pointer-events:none}
</style>
</head>
<body>
<div class="app" id="app">

  <header>
    <a class="hd-btn ic" href="../" title="Volver a la app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>Editor de mapa</h1>
    <button class="hd-btn ic" id="btn-save" title="Guardar en Mis mapas"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7"/><path d="M8 14h8"/><path d="M8 17h8"/></svg></button>
    <button class="hd-btn ic" id="btn-clear" title="Limpiar el plano"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg></button>
    <button class="hd-btn ic" id="btn-maps" title="Mis mapas"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5 12 12l9-4.5z"/><path d="M3 12l9 4.5L21 12"/><path d="M3 16.5 12 21l9-4.5"/></svg></button>
    <!-- TEMPORAL: recarga anti-caché para el móvil (quitar al acabar) -->
    <button class="hd-btn ic" id="btn-reload" title="Recargar"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-1.5 6"/><path d="M20 4v6h-6"/></svg></button>
  </header>

  <div class="name-row">
    <input id="map-name" type="text" placeholder="Nombre de la sala (p. ej. Sala principal)" maxlength="40">
  </div>

  <!-- ── Tres secciones ── -->
  <div class="tabs" id="tabs">
    <button class="tab is-on" data-tab="estructura">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 11h9v8"/></svg>
      Estructura
    </button>
    <button class="tab" data-tab="elementos">
      <svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="3"/><rect x="14" y="4" width="6" height="6" rx="1"/><path d="M7 14l3 6H4z"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
      Elementos
    </button>
    <button class="tab" data-tab="camaras">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 10l6-3v10l-6-3"/></svg>
      Cámaras
    </button>
  </div>

  <div class="canvas-wrap">
    <div id="canvas">
      <svg id="floor" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div id="toast"></div>
      <div id="undobar"><span id="undobar-txt"></span><button id="undobar-btn">Deshacer</button></div>
    </div>
  </div>

  <!-- paneles de abajo (con scroll si la pantalla es pequeña) -->
  <div class="below" id="below">
  <!-- panel de edición: izq (forma) · centro (joystick) · dcha (acciones) -->
  <div class="edit-panel" id="edit-panel">
    <div class="ep-tools">
      <span class="ep-hint" id="ep-hint">Toca una pieza o un elemento del mapa para editarlo</span>
      <!-- IZQUIERDA: fila1 agrandar/reducir · fila2 girar (centrado) -->
      <div class="ep-left">
        <button id="btn-bigger" class="c-size" title="Más grande (toda la forma)"><svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M21 3l-6 6"/><path d="M9 21H3v-6"/><path d="M3 21l6-6"/></svg></button>
        <button id="btn-smaller" class="c-size" title="Más pequeño (toda la forma)"><svg viewBox="0 0 24 24"><path d="M21 9h-6V3"/><path d="M21 3l-6 6"/><path d="M3 15h6v6"/><path d="M3 21l6-6"/></svg></button>
        <button id="btn-rot" class="c-size ep-rot" title="Girar"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.4 5.7"/><path d="M4 20v-5h5"/></svg></button>
      </div>
      <!-- CENTRO: joystick (arriba/abajo = alto, izq/dcha = ancho) -->
      <div class="ep-joy">
        <button id="btn-hp" class="c-size joy-up"    title="Estirar alto"><svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg></button>
        <button id="btn-wm" class="c-size joy-left"  title="Encoger ancho"><svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg></button>
        <button id="btn-wp" class="c-size joy-right" title="Estirar ancho"><svg viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></svg></button>
        <button id="btn-hm" class="c-size joy-down"  title="Encoger alto"><svg viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg></button>
      </div>
    </div>
    <!-- DERECHA: rejilla 3×2 → col1 deshacer/rehacer · col2 texto/duplicar · col3 bloquear/borrar
         (texto justo ENCIMA de duplicar; sin efecto pirámide) -->
    <div class="ep-right">
      <button id="btn-undo" title="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5"/><path d="M4 12h10a5 5 0 0 1 0 10h-2"/></svg></button>
      <button id="btn-redo" title="Rehacer"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a5 5 0 0 0 0 10h2"/></svg></button>
      <button id="btn-text" class="c-text" title="Editar texto"><svg viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M13.5 6.5l3 3"/></svg></button>
      <button id="btn-color" class="c-color" title="Color de la pieza"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.6 6 10.2A6 6 0 0 1 6 13.2C6 9.6 12 3 12 3z"/></svg></button>
      <button id="btn-lock" class="c-lock" title="Bloquear posición"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      <button id="btn-dup" class="c-dup" title="Duplicar"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg></button>
      <button id="btn-del" class="c-del" title="Quitar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>

  <!-- cuerpo de la sección activa -->
  <div class="tab-body">
    <div class="tab-pane" data-tab="estructura" id="pane-estructura">
      <div class="shapes" id="shapes">
        <button class="shape-btn" data-kind="rect">
          <svg viewBox="0 0 100 100"><rect class="fl" x="12" y="22" width="76" height="56"/></svg>
          <span>Rect</span>
        </button>
        <button class="shape-btn" data-kind="ele">
          <svg viewBox="0 0 100 100"><path class="fl" d="M22 14 H58 V52 H86 V86 H22 Z"/></svg>
          <span>En L</span>
        </button>
        <button class="shape-btn" data-kind="te">
          <svg viewBox="0 0 100 100"><path class="fl" d="M14 16 H86 V44 H64 V86 H36 V44 H14 Z"/></svg>
          <span>En T</span>
        </button>
        <button class="shape-btn" data-kind="semi">
          <svg viewBox="0 0 100 100"><path class="fl" d="M16 70 A34 34 0 0 1 84 70 Z"/></svg>
          <span>Semi</span>
        </button>
      </div>
      <div class="struct-row">
        <button class="vis-toggle" id="vis-toggle">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="vis-toggle-lbl">Ocultar elementos</span>
        </button>
        <button class="vis-toggle" id="grid-btn" title="Mostrar u ocultar la rejilla">
          <svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
          <span id="grid-btn-lbl">Quitar grid</span>
        </button>
        <button class="vis-toggle" id="bg-btn" title="Color de fondo del mapa">
          <span class="bg-sw" id="bg-swatch"></span>
          <span>Fondo</span>
        </button>
      </div>
      <p class="pane-hint">Toca para añadir · solapa varias para componer la planta.</p>
    </div>

    <div class="tab-pane hidden" data-tab="elementos" id="pane-elementos">
      <div class="el-grid" id="pal-main"></div>
      <div class="otros">
        <span class="otros-lbl">Otros</span>
        <div class="otros-row" id="pal-otros"></div>
      </div>
      <p class="pane-hint">Arrastra al plano o toca para colocar.</p>
    </div>

    <div class="tab-pane hidden" data-tab="camaras" id="pane-camaras">
      <div id="pal-cam"></div>

/* aclara un color hex hacia blanco (para derivar el contorno de una pieza recoloreada) */
function lighten(hex, amt){
  const n = parseInt(hex.replace('#',''), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = Math.round(r + (255-r)*amt); g = Math.round(g + (255-g)*amt); b = Math.round(b + (255-b)*amt);
  return '#' + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
/* ¿es un fondo claro? (para suavizar la rejilla: sobre papel se ve demasiado oscura) */
function isLightColor(hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex)) return false;
  const n = parseInt(hex.slice(1), 16);
  return (0.2126*((n>>16)&255) + 0.7152*((n>>8)&255) + 0.0722*(n&255)) > 150;
}

  document.querySelectorAll('.tab-pane').forEach(p => {
    const hidden = p.classList.contains('hidden');
    if(hidden) p.classList.remove('hidden');
    max = Math.max(max, p.offsetHeight);

  });
  const pad = 13;   // padding vertical del .tab-body (box-sizing: border-box)
  body.style.minHeight = (max + pad) + 'px';
}

/* ───────── persistencia ───────── */
function loadDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    let d = JSON.parse(raw);
    if(!d) return;
    /* migración desde v0.1 (forma única + salida/entrada separadas) */
    if(d.shape){
      const kindMap = { rect:'rect', cuadrado:'rect', ele:'ele', te:'te', ovalo:'semi' };
      d = { id:'m' + Date.now(), name:d.name || '',
            pieces:[{ id:1, kind:kindMap[d.shape] || 'rect', x:50, y:50, w:80, h:85, rot:0 }],
            elements:(d.elements || []).map(e => ({
              ...e, type:(e.type === 'salida' || e.type === 'entrada') ? 'acceso' : e.type
            })).filter(e => TYPES[e.type]) };
    }
    if(Array.isArray(d.pieces) && Array.isArray(d.elements)){
      state = d;
      syncSeq();
      saveDraft();          // persiste posibles migraciones de formato
    }
  }catch(e){}
}
function syncSeq(){
  idSeq = 1 + Math.max(0,
    ...state.pieces.map(p => p.id),
    ...state.elements.map(e => e.id));
}
function saveDraft(){
  localStorage.setItem(DRAFT_KEY, JSON.stringify(state));
  if(!histLock) pushHist();
}

/* ───────── deshacer / rehacer (historial de estados) ───────── */
let history = [], histIdx = -1, histLock = false;
function pushHist(){
  const snap = JSON.stringify(state);
  if(history[histIdx] === snap) return;          // sin cambios reales
  history = history.slice(0, histIdx + 1);       // descarta el "futuro" al ramificar
  history.push(snap);
  if(history.length > 80){ history.shift(); }    // límite de memoria
  histIdx = history.length - 1;
  updateUndoRedo();
}
function restoreHist(){
  histLock = true;
  const keepEl = selEl, keepPiece = selPiece;
  const prevEls = new Set(state.elements.map(e => e.id));     // ids antes de restaurar
  const prevPieces = new Set(state.pieces.map(p => p.id));
  state = JSON.parse(history[histIdx]);
  syncSeq();
  /* conservar la selección si la figura sigue existiendo tras deshacer/rehacer */
  selEl    = state.elements.some(e => e.id === keepEl)    ? keepEl    : null;
  selPiece = state.pieces.some(p => p.id === keepPiece)   ? keepPiece : null;
  /* si deshacer RECUPERA un único objeto que se había borrado, vuelve seleccionado */
  if(selEl == null && selPiece == null){
    const backEls = state.elements.filter(e => !prevEls.has(e.id));
    const backPieces = state.pieces.filter(p => !prevPieces.has(p.id));
    if(backEls.length + backPieces.length === 1){
      if(backEls.length) selEl = backEls[0].id; else selPiece = backPieces[0].id;
    }
  }
  $('#map-name').value = state.name || '';
  renderFloor(); renderElements(); renderEditPanel(); applyBg();
  localStorage.setItem(DRAFT_KEY, JSON.stringify(state));
  histLock = false;
  updateUndoRedo();
}
function undo(){ if(histIdx > 0){ histIdx--; restoreHist(); } }
function redo(){ if(histIdx < history.length - 1){ histIdx++; restoreHist(); } }
function updateUndoRedo(){
  const u = document.getElementById('btn-undo'), r = document.getElementById('btn-redo');
  if(u) u.disabled = histIdx <= 0;
  if(r) r.disabled = histIdx >= history.length - 1;
}
function loadLib(){
  try{ return JSON.parse(localStorage.getItem(LIB_KEY)) || []; }catch(e){ return []; }
}
function saveToLibrary(){
  const lib = loadLib();
  const snap = JSON.parse(JSON.stringify(state));
  snap.updated = Date.now();
  const i = lib.findIndex(m => m.id === state.id);
  if(i >= 0) lib[i] = snap; else lib.push(snap);
  localStorage.setItem(LIB_KEY, JSON.stringify(lib));
  saveDraft();
  toast('Mapa guardado en Mis mapas');
}

/* ───────── render de la planta (piezas) ───────── */
function pieceTransform(p){
  return 'translate(' + p.x + ' ' + p.y + ') rotate(' + (p.rot||0) +
         ') scale(' + p.w + ' ' + p.h + ') translate(-0.5 -0.5)';
}
/* marcas viales (bordes continuos + eje discontinuo) en coords unitarias, según la forma */
function roadMarks(p){
  const tr = pieceTransform(p);
  let s = '';
  if(PIECES_DEF[p.kind].path === P_DONUT){
    // arcos concéntricos dentro de la banda (radios 0.75–1): bordes + eje central
    s += '<path class="rm-solid" d="M0.97 1 A0.97 0.97 0 0 0 0 0.03" transform="' + tr + '"/>';
    s += '<path class="rm-solid" d="M0.78 1 A0.78 0.78 0 0 0 0 0.22" transform="' + tr + '"/>';
    s += '<path class="rm-dash"  d="M0.875 1 A0.875 0.875 0 0 0 0 0.125" transform="' + tr + '"/>';
  }else{
    // rectángulo: líneas a lo largo del eje X (la carretera es larga en X por defecto)
    s += '<path class="rm-solid" d="M0.05 0.18 H0.95" transform="' + tr + '"/>';
    s += '<path class="rm-solid" d="M0.05 0.82 H0.95" transform="' + tr + '"/>';
    s += '<path class="rm-dash"  d="M0.07 0.5 H0.93"  transform="' + tr + '"/>';
  }
  return s;
}
/* peldaños (escalera / grada de hormigón): líneas paralelas a lo ancho */
function stepMarks(p, kind){
  const tr = pieceTransform(p), n = 6, cls = kind === 'grada' ? 'step-line step-grada' : 'step-line';
  let s = '';
  for(let i = 1; i < n; i++){
    const y = (i / n).toFixed(3);
    s += '<path class="' + cls + '" d="M0.05 ' + y + ' H0.95" transform="' + tr + '"/>';
  }
  return s;
}
/* líneas de PISTA (fútbol/tenis/pádel/baloncesto) en coords unitarias 0..1 */
function courtMarks(p, sport){
  const tr = pieceTransform(p), a = 0.07, b = 0.93, c = 0.5;
  const P = d => '<path class="court-line" d="' + d + '" transform="' + tr + '"/>';
  const C = (cx, cy, r) => '<circle class="court-line" cx="' + cx + '" cy="' + cy + '" r="' + r + '" transform="' + tr + '"/>';
  let s = P('M' + a + ' ' + a + ' H' + b + ' V' + b + ' H' + a + ' Z');     // borde exterior
  if(sport === 'futbol'){
    s += P('M' + a + ' ' + c + ' H' + b) + C(c, c, 0.12);                   // medio campo + círculo central
    s += P('M0.3 ' + a + ' V0.2 H0.7 V' + a) + P('M0.3 ' + b + ' V0.8 H0.7 V' + b);  // áreas
  }else if(sport === 'tenis'){
    s += P('M' + a + ' ' + c + ' H' + b);                                   // red
    s += P('M0.18 ' + a + ' V' + b + ' M0.82 ' + a + ' V' + b);             // individuales
    s += P('M0.18 0.3 H0.82 M0.18 0.7 H0.82 M' + c + ' 0.3 V0.7');          // saque
  }else if(sport === 'padel'){
    s += P('M' + a + ' ' + c + ' H' + b);                                   // red
    s += P('M' + a + ' 0.3 H' + b + ' M' + a + ' 0.7 H' + b + ' M' + c + ' 0.3 V0.7');
  }else if(sport === 'baloncesto'){
    s += P('M' + a + ' ' + c + ' H' + b) + C(c, c, 0.1);                    // medio campo + círculo
    s += P('M0.36 ' + a + ' V0.26 H0.64 V' + a) + C(c, 0.26, 0.08);         // zona arriba
    s += P('M0.36 ' + b + ' V0.74 H0.64 V' + b) + C(c, 0.74, 0.08);         // zona abajo
  }
  return s;
}
/* ola: trazo ondulado HORIZONTAL (todas en la misma dirección, sin rotar) */
function waveGlyph(x, y){
  return '<path class="dec-wave" d="M-1.7 0 q0.85 -0.85 1.7 0 q0.85 0.85 1.7 0" transform="translate(' + x + ' ' + y + ')"/>';
}
/* mata de hierba: varias briznas abriéndose en abanico hacia ARRIBA (mismo sentido) */
const GRASS_BLADES = [[-46,2.4],[-23,3.2],[0,3.8],[23,3.2],[46,2.4]];   // [ángulo°, largo]
function grassGlyph(x, y){
  let bl = '';
  for(const [deg, L] of GRASS_BLADES){
    const a = deg * 0.0174533, sx = Math.sin(a), cy = -Math.cos(a);   // arriba = −y
    const tx = (sx*L).toFixed(2), ty = (cy*L).toFixed(2);
    const mx = (sx*L*0.55).toFixed(2), my = (cy*L*0.55).toFixed(2);   // control = brizna recta
    bl += '<path class="dec-grass" d="M-0.32 0 Q' + mx + ' ' + my + ' ' + tx + ' ' + ty +
          ' Q' + mx + ' ' + my + ' 0.32 0 Z"/>';
  }
  return '<g transform="translate(' + x + ' ' + y + ')">' + bl + '</g>';
}
/* flor diminuta: 5 pétalos + centro (aún más pequeña que antes) */
function flowerGlyph(x, y){
  let pet = '';
  for(let k = 0; k < 5; k++){
    const a = k * 1.2566;
    pet += '<circle class="dec-petal" cx="' + (Math.cos(a)*0.62).toFixed(2) +
           '" cy="' + (Math.sin(a)*0.62).toFixed(2) + '" r="0.42"/>';
  }
  return '<g transform="translate(' + x + ' ' + y + ')">' + pet + '<circle class="dec-core" cx="0" cy="0" r="0.34"/></g>';
}
/* esparce glifos por el área de la pieza con posición ALEATORIA (jitter determinista
   por pieza+celda → no parpadea) y algún hueco; agua=olas horizontales · jardín=hierba
   (mayoría) con alguna flor; siempre orientados igual (sin rotación). Dentro de la forma. */
function decorMarks(p, type){
  const bb = pieceBBox(p), isCircle = PIECES_DEF[p.kind].path === P_CIRC;
  const STEP = 12;
  const nx = Math.max(1, Math.round((bb.r - bb.l) / STEP));
  const ny = Math.max(1, Math.round((bb.b - bb.t) / STEP));
  const cw = (bb.r - bb.l) / nx, ch = (bb.b - bb.t) / ny;
  let s = '';
  for(let i = 0; i < nx; i++){
    for(let j = 0; j < ny; j++){
      const seed = p.id*97 + i*131 + j*57;
      if(rnd(seed + 0.7) < 0.18) continue;                       // ~18% de huecos → menos uniforme
      const gx = bb.l + cw*(i + 0.5) + (rnd(seed)*2 - 1)*cw*0.42;       // jitter dentro de la celda
      const gy = bb.t + ch*(j + 0.5) + (rnd(seed + 0.3)*2 - 1)*ch*0.42;
      if(isCircle){                                              // mantener los glifos dentro del óvalo
        const ux = (gx - p.x) / bb.hw, uy = (gy - p.y) / bb.hh;
        if(ux*ux + uy*uy > 0.66) continue;
      }
      const X = +gx.toFixed(2), Y = +gy.toFixed(2);
      if(type === 'waves') s += waveGlyph(X, Y);
      else s += (rnd(seed + 0.5) < 0.22) ? flowerGlyph(X, Y) : grassGlyph(X, Y);   // jardín
    }
  }
  return s;
}
function renderFloor(){
  let glow = '', body = '', sel = '';
  state.pieces.forEach(p => {
    const def = PIECES_DEF[p.kind], d = def.path, tr = pieceTransform(p);
    /* color por pieza (p.color) o el de la definición; el contorno se aclara desde el cuerpo */
    const fill = p.color || def.fill || '#161616';
    const edge = p.color ? lighten(p.color, 0.28) : (def.edge || '#3da9ff');
    glow += '<path class="pglow" data-id="' + p.id + '" fill="' + edge + '" stroke="' + edge + '" d="' + d + '" transform="' + tr + '"/>';
    /* RELLENO + su DECORACIÓN intercalados por pieza → la decoración acompaña a su
       figura en el orden Z (una pieza por encima tapa la decoración de la de abajo) */
    body += '<path class="pfl" fill="' + fill + '" stroke="' + fill + '" d="' + d + '" transform="' + tr + '" data-id="' + p.id + '"/>';
    const col = fill.toLowerCase();
    let dec = '';
    if(def.road && col === CARRETERA_COLOR) dec = roadMarks(p);
    else if(col === ESCALERA_COLOR) dec = stepMarks(p, 'stairs');
    else if(col === GRADA_COLOR) dec = stepMarks(p, 'grada');
    else if(COURTS[col]) dec = courtMarks(p, COURTS[col]);
    else if(def.path !== P_DONUT){
      if(col === AGUA_COLOR) dec = decorMarks(p, 'waves');
      else if(GREEN_COLORS.includes(col)) dec = decorMarks(p, 'flowers');
    }
    if(dec) body += '<g class="decor" data-id="' + p.id + '">' + dec + '</g>';
    if(p.id === selPiece)
      sel += '<path class="psel" d="' + d + '" transform="' + tr + '"/>';
  });
  floor.innerHTML = '<g class="glowg">' + glow + '</g><g class="bodyg">' + body + '</g><g>' + sel + '</g>';
  floor.querySelectorAll('.pfl').forEach(path =>
    path.addEventListener('pointerdown', ev => startDragPiece(ev, +path.dataset.id, path)));
}
/* aspecto del lienzo: color de fondo (sobre la rejilla) + mostrar/ocultar rejilla */
function applyBg(){
  canvas.style.backgroundColor = state.bg || '';
  canvas.classList.toggle('no-grid', !!state.gridOff);
  canvas.classList.toggle('light-bg', isLightColor(state.bg || ''));   // rejilla más suave sobre fondo claro
  const sw = $('#bg-swatch');
  if(sw) sw.style.background = state.bg || 'var(--surface-2)';
  const gl = $('#grid-btn-lbl');
  if(gl) gl.textContent = state.gridOff ? 'Mostrar grid' : 'Quitar grid';
  const gb = $('#grid-btn');
  if(gb) gb.classList.toggle('off', !!state.gridOff);
}

/* ───────── render de elementos ───────── */
function renderElements(){
  canvas.querySelectorAll('.el').forEach(n => n.remove());
  state.elements.forEach(e => canvas.appendChild(makeNode(e)));
}
function makeNode(e){
  const t = TYPES[e.type];
  const n = document.createElement('div');
  n.className = 'el t-' + e.type + (t.silhouette ? ' sil' : '') + (e.id === selEl ? ' sel' : '') + (e.locked ? ' locked' : '');
  n.dataset.id = e.id;
  n.style.setProperty('--el-c', t.color);
  n.style.setProperty('--rot', (e.rot||0) + 'deg');
  n.style.setProperty('--w', (e.w || t.w || 30) + 'px');
  n.style.setProperty('--h', (e.h || t.h || 30) + 'px');
  n.style.left = e.x + '%';
  n.style.top  = e.y + '%';
  /* texto: el escrito por el usuario manda; si no hay, los genéricos van en blanco
     (blankLabel) y el resto muestra su etiqueta por defecto */
  const hasText = e.text != null && e.text !== '';
  const labelText = t.silhouette ? '' : (hasText ? e.text : (t.blankLabel ? '' : t.label));
  n.innerHTML = '<div class="ic">' + t.icon + '</div>' +
                (labelText ? '<div class="lb">' + escapeHtml(labelText) + '</div>' : '') +
                '<span class="lock-badge"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>';
  n.addEventListener('pointerdown', ev => startDragEl(ev, e.id, n));
  return n;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ───────── panel de edición ───────── */
/* contextuales (dependen de la selección); deshacer/rehacer van SIEMPRE visibles aparte */
const CTX_BTNS = ['btn-text','btn-color','btn-rot','btn-smaller','btn-bigger','btn-wm','btn-wp','btn-hm','btn-hp','btn-dup','btn-lock','btn-del'];
function renderEditPanel(){
  const panel = $('#edit-panel');
  panel.style.borderLeftColor = SECTION_COLOR[currentTab] || 'var(--accent)';
  $('#btn-undo').classList.add('on');     // deshacer/rehacer SIEMPRE presentes
  $('#btn-redo').classList.add('on');
  updateUndoRedo();
  const show = ids => CTX_BTNS.forEach(id => $('#'+id).classList.toggle('on', ids.includes(id)));
  const e = state.elements.find(x => x.id === selEl);
  const p = state.pieces.find(x => x.id === selPiece);
  /* refleja el estado del candado en su botón */
  const setLock = locked => {
    const b = $('#btn-lock');
    b.classList.toggle('is-locked', !!locked);
    b.title = locked ? 'Desbloquear posición' : 'Bloquear posición';
    b.querySelector('svg').innerHTML = locked
      ? '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'      // cerrado
      : '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-1.5"/>';   // abierto
  };
  if(e){
    const t = TYPES[e.type];
    panel.classList.remove('is-hint');
    setLock(e.locked);
    const ids = ['btn-rot','btn-wm','btn-wp','btn-hm','btn-hp','btn-smaller','btn-bigger','btn-dup','btn-lock','btn-del'];
    if(t.editable) ids.unshift('btn-text');
    show(ids);
  }else if(p){
    panel.classList.remove('is-hint');
    setLock(p.locked);
    const ids = ['btn-rot','btn-wm','btn-wp','btn-hm','btn-hp','btn-smaller','btn-bigger','btn-dup','btn-lock','btn-del'];
    if(PIECES_DEF[p.kind].fill) ids.unshift('btn-color');   // solo piezas de área (exterior) recoloreables
    show(ids);
  }else{
    panel.classList.add('is-hint');   // solo deshacer/rehacer + texto de ayuda
    $('#ep-hint').textContent = SECTION_HINT[currentTab] || 'Toca una pieza o elemento para editarlo';
    show([]);
  }
  updatePieceNav();
}
function select(elId, pieceId){
  selEl = elId; selPiece = pieceId;
  canvas.querySelectorAll('.el').forEach(n =>
    n.classList.toggle('sel', +n.dataset.id === elId));
  renderFloor();          // repinta el contorno de selección de pieza
  renderEditPanel();
}

/* ───────── acciones del panel ───────── */
$('#btn-rot').addEventListener('click', () => {
  const e = state.elements.find(x => x.id === selEl);
  const p = state.pieces.find(x => x.id === selPiece);
  if(e){
    e.rot = ((e.rot||0) + 45) % 360;
    const n = canvas.querySelector('.el[data-id="' + e.id + '"]');
    if(n) n.style.setProperty('--rot', e.rot + 'deg');
  }else if(p){
    p.rot = ((p.rot||0) + 90) % 360;
    renderFloor();
  }
  saveDraft();
});
const clampN = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
/* redimensión por eje (sw/sh = sentido). Funciona en elementos y en piezas */
function resizeSel(sw, sh){
  const e = state.elements.find(x => x.id === selEl);
  if(e){
    const t = TYPES[e.type];
    if(sw) e.w = clampN((e.w || t.w || 30) + sw * ELEM_STEP, ELEM_MIN, ELEM_MAX);
    if(sh) e.h = clampN((e.h || t.h || 30) + sh * ELEM_STEP, ELEM_MIN, ELEM_MAX);
    const n = canvas.querySelector('.el[data-id="' + e.id + '"]');
    if(n){ n.style.setProperty('--w', e.w + 'px'); n.style.setProperty('--h', e.h + 'px'); }
    saveDraft();
    return;
  }
  const p = state.pieces.find(x => x.id === selPiece);
  if(!p) return;
  /* si la pieza está girada 90/270°, lo que el usuario ve como ancho es h */
  const swapped = (p.rot||0) % 180 !== 0;
  const kw = swapped ? 'h' : 'w', kh = swapped ? 'w' : 'h';
  /* paso de 5 sobre rejilla común (defaults múltiplos de 5) → cualquier lado de
     una pieza puede igualarse al de otra (diámetro del semicírculo = lado del rect) */
  const pmin = pieceMin(p);
  if(sw) p[kw] = clampN(p[kw] + sw * PIECE_STEP, pmin, PIECE_MAX);
  if(sh) p[kh] = clampN(p[kh] + sh * PIECE_STEP, pmin, PIECE_MAX);
  renderFloor();
  saveDraft();
}
$('#btn-wm').addEventListener('click', () => resizeSel(-1, 0));
$('#btn-wp').addEventListener('click', () => resizeSel( 1, 0));
$('#btn-hm').addEventListener('click', () => resizeSel(0, -1));
$('#btn-hp').addEventListener('click', () => resizeSel(0,  1));

/* escala uniforme (más grande / más pequeño) — elementos Y formas */
function scaleSel(dir){
  const e = state.elements.find(x => x.id === selEl);
  if(e){
    const t = TYPES[e.type];
    const f = dir > 0 ? 1.18 : 1 / 1.18;
    e.w = Math.round(clampN((e.w || t.w || 30) * f, ELEM_MIN, ELEM_MAX));
    e.h = Math.round(clampN((e.h || t.h || 30) * f, ELEM_MIN, ELEM_MAX));
    const n = canvas.querySelector('.el[data-id="' + e.id + '"]');
    if(n){ n.style.setProperty('--w', e.w + 'px'); n.style.setProperty('--h', e.h + 'px'); }
    saveDraft();
    return;
  }
  const p = state.pieces.find(x => x.id === selPiece);
  if(!p) return;
  const step = dir > 0 ? PIECE_STEP : -PIECE_STEP;   // un paso de rejilla en ambos ejes
  const pmin = pieceMin(p);
  p.w = clampN(p.w + step, pmin, PIECE_MAX);
  p.h = clampN(p.h + step, pmin, PIECE_MAX);
  renderFloor();
  saveDraft();
}
$('#btn-bigger').addEventListener('click', () => scaleSel(1));
$('#btn-smaller').addEventListener('click', () => scaleSel(-1));

/* duplicar el elemento o la pieza seleccionada (desplazado un poco) */
$('#btn-dup').addEventListener('click', () => {
  if(selEl != null){
    const e = state.elements.find(x => x.id === selEl);
    if(!e) return;
    const c = JSON.parse(JSON.stringify(e));
    c.id = idSeq++; c.locked = false;
    c.x = clampN(e.x + 6, 4, 96); c.y = clampN(e.y + 6, 6, 94);
    state.elements.push(c);
    canvas.appendChild(makeNode(c));
    select(c.id, null);
  }else if(selPiece != null){
    const p = state.pieces.find(x => x.id === selPiece);
    if(!p) return;
    const c = JSON.parse(JSON.stringify(p));
    c.id = idSeq++; c.locked = false;
    c.x = clampN(p.x + 6, 2, 98); c.y = clampN(p.y + 6, 2, 98);
    state.pieces.push(c);
    select(null, c.id);
  }
  saveDraft();
});

/* bloquear / desbloquear la posición */
$('#btn-lock').addEventListener('click', () => {
  const obj = state.elements.find(x => x.id === selEl) ||
              state.pieces.find(x => x.id === selPiece);
  if(!obj) return;
  obj.locked = !obj.locked;
  if(selEl != null) renderElements(); else renderFloor();
  renderEditPanel();
  saveDraft();
});
$('#btn-text').addEventListener('click', async () => {
  const e = state.elements.find(x => x.id === selEl);
  if(!e || !TYPES[e.type].editable) return;
  const v = await openTextModal(e.text || '');
  if(v === null) return;
  e.text = v.trim().slice(0, 24);
  renderElements();
  renderEditPanel();
  saveDraft();
});
/* color de la pieza seleccionada (presets + paleta completa) */
$('#btn-color').addEventListener('click', () => {
  const p = state.pieces.find(x => x.id === selPiece);
  if(!p) return;
  const def = PIECES_DEF[p.kind];
  /* las pistas (fútbol/tenis/pádel/baloncesto) solo para el cuadrado redondeado (jardín) */
  const presets = (p.kind === 'jardin') ? PIECE_COLORS.concat(COURT_COLORS) : PIECE_COLORS;
  openColorSheet({
    title:'Color de la pieza',
    current: p.color || def.fill || '',
    presets: presets,
    onPick: col => { p.color = col; renderFloor(); saveDraft(); }
  });
});

/* ───────── modal de texto (sustituye al prompt del SO) ───────── */
function openTextModal(current){
  return new Promise(resolve => {
    const m = $('#text-modal'), inp = $('#tm-input');
    inp.value = current || '';
    m.classList.add('open');
    setTimeout(() => { inp.focus(); inp.select(); }, 60);
    const done = val => { m.classList.remove('open'); cleanup(); resolve(val); };
    const ok = () => done(inp.value);
    const cancel = () => done(null);
    const key = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); ok(); } else if(ev.key === 'Escape'){ cancel(); } };
    const backdrop = ev => { if(ev.target === m) cancel(); };
    function cleanup(){
      $('#tm-ok').removeEventListener('click', ok);
      $('#tm-cancel').removeEventListener('click', cancel);
      inp.removeEventListener('keydown', key);
      m.removeEventListener('click', backdrop);
    }
    $('#tm-ok').addEventListener('click', ok);
    $('#tm-cancel').addEventListener('click', cancel);
    inp.addEventListener('keydown', key);
    m.addEventListener('click', backdrop);
  });
}

/* caja contenedora (en %) de una pieza, según su rotación */
function pieceBBox(p){
  const sw = (p.rot||0) % 180 !== 0;
  const hw = (sw ? p.h : p.w) / 2, hh = (sw ? p.w : p.h) / 2;
  return { hw, hh, l:p.x-hw, r:p.x+hw, t:p.y-hh, b:p.y+hh };
}
const SNAP_T = 1.6;          // umbral de imantado de BORDE (% ≈ 5px): sutil
const SNAP_CORNER = 2.4;     // umbral de imantado de ESQUINA (% ≈ 8px): un poco más generoso

/* vértices del polígono de cada pieza en coords unitarias (0..1).
   semi = solo su lado recto (diámetro): la curva no es una arista que imantar */
const PIECE_VERTS = {
  rect: [[0,0],[1,0],[1,1],[0,1]],
  ele:  [[0,0],[0.62,0],[0.62,0.5],[1,0.5],[1,1],[0,1]],
  te:   [[0,0],[1,0],[1,0.38],[0.66,0.38],[0.66,1],[0.34,1],[0.34,0.38],[0,0.38]],
  semi: [[0,1],[1,1]],
  /* exterior — rectángulos: caja completa; donut: sus 4 esquinas (los 2 cortes
     radiales son aristas rectas → imantan de lado); círculo: puntos cardinales */
  carretera: [[0,0],[1,0],[1,1],[0,1]],
  camino:    [[0,0],[1,0],[1,1],[0,1]],
  agua:      [[0,0],[1,0],[1,1],[0,1]],
  jardin:    [[0,0],[1,0],[1,1],[0,1]],
  carretera_c: [[1,1],[0,0],[0,0.25],[0.75,1]],
  camino_c:    [[1,1],[0,0],[0,0.25],[0.75,1]],
  agua_c:    [[0.5,0],[1,0.5],[0.5,1],[0,0.5]]
};
/* vértices de la pieza en % del lienzo (posición/tamaño/rotación múltiplo de 90) */
function pieceVerts(p){
  const u = PIECE_VERTS[p.kind] || PIECE_VERTS.rect;
  const r = ((p.rot||0) % 360 + 360) % 360;
  const cos = r===90?0 : r===180?-1 : r===270?0 : 1;
  const sin = r===90?1 : r===180?0 : r===270?-1 : 0;
  return u.map(([ux,uy]) => {
    const dx = (ux-0.5)*p.w, dy = (uy-0.5)*p.h;
    return { x: p.x + dx*cos - dy*sin, y: p.y + dx*sin + dy*cos };
  });
}
/* aristas REALES de la pieza: verticales {x,y0,y1} y horizontales {y,x0,x1} */
function pieceEdges(p){
  const pts = pieceVerts(p), v = [], h = [], n = pts.length;
  const lim = (p.kind === 'semi') ? n-1 : n;   // el semi es un segmento abierto
  for(let i=0;i<lim;i++){
    const a = pts[i], b = pts[(i+1)%n];
    if(Math.abs(a.x-b.x) < 0.05) v.push({ x:(a.x+b.x)/2, y0:Math.min(a.y,b.y), y1:Math.max(a.y,b.y) });
    else if(Math.abs(a.y-b.y) < 0.05) h.push({ y:(a.y+b.y)/2, x0:Math.min(a.x,b.x), x1:Math.max(a.x,b.x) });
  }
  return { v, h };
}
/* Imán por BORDES REALES (incluye los lados interiores de la L y la T) + imán de
   ESQUINA a esquina: alinea una arista de la pieza con la de otra cuando se solapan de
   verdad, y además hace coincidir un vértice con el vértice de otra pieza si está cerca
   (así, con dos bases tocándose, las esquinas se cuadran solas). Devuelve el índice o -1. */
function snapPiece(p){
  const eA = pieceEdges(p), vA = pieceVerts(p);
  /* mdx/mdy = mejor distancia de imantado por eje (inicia en el umbral mayor, el de esquina) */
  let dx = 0, dy = 0, mdx = SNAP_CORNER, mdy = SNAP_CORNER, hit = -1;
  state.pieces.forEach((q, qi) => {
    if(q.id === p.id) return;
    const eB = pieceEdges(q), vB = pieceVerts(q);
    // alineación de BORDES (perpendicular): aristas que se solapan de verdad (umbral SNAP_T)
    for(const a of eA.v) for(const b of eB.v){          // verticales → imanta X
      const ov = Math.min(a.y1,b.y1) - Math.max(a.y0,b.y0);
      const d = Math.abs(a.x - b.x);
      if(ov > 1.5 && d < SNAP_T && d < mdx){ mdx = d; dx = b.x - a.x; hit = qi; }
    }
    for(const a of eA.h) for(const b of eB.h){          // horizontales → imanta Y
      const ov = Math.min(a.x1,b.x1) - Math.max(a.x0,b.x0);
      const d = Math.abs(a.y - b.y);
      if(ov > 1.5 && d < SNAP_T && d < mdy){ mdy = d; dy = b.y - a.y; hit = qi; }
    }
    // imán de ESQUINA: un vértice cerca de otro vértice EN AMBOS ejes → cuádralos (umbral mayor)
    for(const a of vA) for(const b of vB){
      const ddx = Math.abs(a.x - b.x), ddy = Math.abs(a.y - b.y);
      if(ddx < SNAP_CORNER && ddy < SNAP_CORNER){
        if(ddx < mdx){ mdx = ddx; dx = b.x - a.x; hit = qi; }
        if(ddy < mdy){ mdy = ddy; dy = b.y - a.y; hit = qi; }
      }
    }
  });
  if(hit >= 0){ p.x = +(p.x+dx).toFixed(2); p.y = +(p.y+dy).toFixed(2); }
  return hit;
}

/* ───────── drag: piezas de planta ───────── */
function startDragPiece(ev, id, path){
  ev.preventDefault();
  ev.stopPropagation();
  const p = state.pieces.find(x => x.id === id);
  if(!p) return;
  /* seleccionar SIN reconstruir el SVG: el path debe seguir vivo para el drag */
  selEl = null; selPiece = id;
  canvas.querySelectorAll('.el').forEach(n => n.classList.remove('sel'));
  /* grupos del SVG: 0 glow · 1 cuerpo (rellenos + decoración intercalados) · 2 selección */
  const glowGroup = floor.children[0];
  const bodyGroup = floor.children[1];
  const selGroup = floor.children[2];
  selGroup.innerHTML = '<path class="psel" d="' + PIECES_DEF[p.kind].path +
                       '" transform="' + pieceTransform(p) + '"/>';
  renderEditPanel();
  if(p.locked) return;     // posición bloqueada: solo selecciona, no arrastra
  try{ path.setPointerCapture(ev.pointerId); }catch(e){}
  const r0 = canvas.getBoundingClientRect();
  const ox = p.x - (ev.clientX - r0.left) / r0.width  * 100;
  const oy = p.y - (ev.clientY - r0.top)  / r0.height * 100;
  /* el glow de esta pieza por data-id (los rellenos ya no van alineados por índice) */
  const strokePath = glowGroup.querySelector('.pglow[data-id="' + id + '"]');
  let moved = false;
  const onMove = mv => {
    if(!moved) bodyGroup.querySelectorAll('.decor').forEach(n => n.remove());  // oculta decoración al arrastrar
    moved = true;
    const r = canvas.getBoundingClientRect();
    let nx = ox + (mv.clientX - r.left) / r.width  * 100;
    let ny = oy + (mv.clientY - r.top)  / r.height * 100;
    p.x = +nx.toFixed(2); p.y = +ny.toFixed(2);
    const hit = snapPiece(p);                 // imantar bordes
    const bb = pieceBBox(p);
    /* EXTERIOR: la pieza puede asomar en CUALQUIER dirección (incluidas las esquinas),
       pero conservando al menos un 20% de su ÁREA dentro del lienzo. Solo si el destino
       dejaría menos de ese 20% se recorta el desplazamiento (a lo largo de la misma
       dirección) y se avisa en ROJO. INTERIOR: se mantiene entera dentro. */
    let tooFar = false;
    if(EXT){
      const KEEP = 0.2;
      const fcx = clampN(p.x, bb.hw, 100 - bb.hw);   // posición “del todo dentro” más cercana
      const fcy = clampN(p.y, bb.hh, 100 - bb.hh);
      const ux = p.x - fcx, uy = p.y - fcy;          // desplazamiento hacia afuera
      const ax = Math.abs(ux) / (2 * bb.hw);         // fracción de área que se pierde por eje (por t)
      const ay = Math.abs(uy) / (2 * bb.hh);
      let t = 1;                                     // fracción del desplazamiento permitida
      /* área dentro al destino = (frac X)·(frac Y), cada fracción acotada a 0 (no negativa) */
      if(Math.max(0, 1 - ax) * Math.max(0, 1 - ay) < KEEP){    // dejaría <20% del área → recorta
        const A = ax * ay, B = ax + ay;
        t = (A < 1e-9) ? (1 - KEEP) / B
                       : (B - Math.sqrt((ax - ay)*(ax - ay) + 4*A*KEEP)) / (2 * A);
        t = clampN(t, 0, 1);
        tooFar = true;                               // topó con el 20% mínimo → ROJO
      }
      p.x = +(fcx + ux * t).toFixed(2);
      p.y = +(fcy + uy * t).toFixed(2);
    }else{
      p.x = +clampN(p.x, bb.hw, 100 - bb.hw).toFixed(2);
      p.y = +clampN(p.y, bb.hh, 100 - bb.hh).toFixed(2);
    }
    /* mover solo los transforms es más fluido que reconstruir el SVG */
    const tr = pieceTransform(p);
    path.setAttribute('transform', tr);
    if(strokePath) strokePath.setAttribute('transform', tr);
    const ps = selGroup.firstChild;
    if(ps) ps.setAttribute('transform', tr);
    /* feedback: ROJO si se pasó del 90% fuera; si no, AMARILLO al imantar un borde */
    glowGroup.querySelectorAll('.pglow.snap').forEach(n => n.classList.remove('snap'));
    path.classList.toggle('too-far', tooFar);
    if(strokePath) strokePath.classList.toggle('too-far', tooFar);
    const snapping = hit >= 0 && !tooFar;
    glowGroup.classList.toggle('snapping', snapping);
    if(snapping){
      if(strokePath) strokePath.classList.add('snap');
      const tgt = glowGroup.children[hit];
      if(tgt) tgt.classList.add('snap');
    }
  };
  const onUp = () => {
    path.removeEventListener('pointermove', onMove);
    path.removeEventListener('pointerup', onUp);
    path.removeEventListener('pointercancel', onUp);
    if(moved){ renderFloor(); saveDraft(); }
  };
  path.addEventListener('pointermove', onMove);
  path.addEventListener('pointerup', onUp);
  path.addEventListener('pointercancel', onUp);
}

/* ───────── drag: elementos colocados ───────── */
function startDragEl(ev, id, node){
  ev.preventDefault();
  ev.stopPropagation();
  select(id, null);
  const e = state.elements.find(x => x.id === id);
  if(!e) return;
  if(e.locked) return;     // posición bloqueada: solo selecciona, no arrastra
  try{ node.setPointerCapture(ev.pointerId); }catch(err){}
  node.classList.add('dragging');
  let moved = false;
  const onMove = mv => {
    moved = true;
    const p = toPct(mv.clientX, mv.clientY, e);
    e.x = p.x; e.y = p.y;
    node.style.left = e.x + '%';
    node.style.top  = e.y + '%';
  };
  const onUp = () => {
    node.classList.remove('dragging');
    node.removeEventListener('pointermove', onMove);
    node.removeEventListener('pointerup', onUp);
    node.removeEventListener('pointercancel', onUp);
    if(moved) saveDraft();
  };
  node.addEventListener('pointermove', onMove);
  node.addEventListener('pointerup', onUp);
  node.addEventListener('pointercancel', onUp);
}
/* posición en % manteniendo el elemento ENTERO dentro del lienzo (margen = medio tamaño) */
function toPct(cx, cy, e){
  const r = canvas.getBoundingClientRect();
  const t = e ? TYPES[e.type] : null;
  const mx = e ? ((e.w || t.w || 30) / 2 / r.width)  * 100 : 4;
  const my = e ? ((e.h || t.h || 30) / 2 / r.height) * 100 : 6;
  const x = clampN((cx - r.left) / r.width  * 100, mx, 100 - mx);
  const y = clampN((cy - r.top)  / r.height * 100, my, 100 - my);
  return { x:+x.toFixed(2), y:+y.toFixed(2) };
}

/* orden Z: el array dibuja de abajo a arriba → mover en el array = adelante/atrás */
function reorderPiece(dir){            // dir -1 = hacia el fondo · +1 = hacia delante
  if(selPiece == null) return;
  const i = state.pieces.findIndex(p => p.id === selPiece), j = i + dir;
  if(i < 0 || j < 0 || j >= state.pieces.length) return;
  const t = state.pieces[i]; state.pieces[i] = state.pieces[j]; state.pieces[j] = t;
  renderFloor(); updatePieceNav(); saveDraft();
}
function cyclePiece(dir){              // como Tab: salta a la forma anterior/siguiente
  if(!state.pieces.length) return;
  let i = state.pieces.findIndex(p => p.id === selPiece);
  i = (i < 0) ? (dir > 0 ? 0 : state.pieces.length - 1)
              : (i + dir + state.pieces.length) % state.pieces.length;
  select(null, state.pieces[i].id);
}

/* exterior: la pestaña Elementos se parte en 2 secciones (SILUETAS / ELEMENTOS),

function startDragPal(ev, type, item){
  ev.preventDefault();
  try{ item.setPointerCapture(ev.pointerId); }catch(e){}
  let moved = false;
  /* el preview del arrastre coincide con lo que se va a colocar: las siluetas llevan
     clase .sil (relleno sin recuadro blanco), igual que el elemento final */
  ghost.innerHTML = '<div class="el t-' + type + (TYPES[type].silhouette ? ' sil' : '') +
    '" style="--el-c:' + TYPES[type].color +
    ';--w:' + (TYPES[type].w || 30) + 'px;--h:' + (TYPES[type].h || 30) +
    'px;position:static;margin:0;transform:none"><div class="ic">' + TYPES[type].icon + '</div></div>';
  const onMove = mv => {
    if(!moved && Math.hypot(mv.clientX - ev.clientX, mv.clientY - ev.clientY) < 6) return;
    moved = true;
    ghost.style.display = 'block';
    ghost.style.left = mv.clientX + 'px';
    ghost.style.top  = mv.clientY + 'px';
  };
  const onUp = up => {
    ghost.style.display = 'none';
    item.removeEventListener('pointermove', onMove);
    item.removeEventListener('pointerup', onUp);
    item.removeEventListener('pointercancel', onUp);
    const r = canvas.getBoundingClientRect();
    if(moved && up.clientX >= r.left && up.clientX <= r.right &&
               up.clientY >= r.top  && up.clientY <= r.bottom){
      addElement(type, toPct(up.clientX, up.clientY));        // soltado sobre el plano
    }else if(!moved){
      addElement(type, { x:50, y:50 });                       // toque simple → al centro
    }
  };
  item.addEventListener('pointermove', onMove);
  item.addEventListener('pointerup', onUp);
  item.addEventListener('pointercancel', onUp);
}

function addElement(type, pos){
  const t = TYPES[type];
  const e = { id:idSeq++, type, x:pos.x, y:pos.y, rot:0, w:t.w || 30, h:t.h || 30 };
  if(t.editable) e.text = '';
  /* mantener el elemento entero dentro del lienzo */
  const r = canvas.getBoundingClientRect();
  const mx = (e.w / 2 / r.width) * 100, my = (e.h / 2 / r.height) * 100;
  e.x = +clampN(e.x, mx, 100 - mx).toFixed(2);
  e.y = +clampN(e.y, my, 100 - my).toFixed(2);
  state.elements.push(e);
  canvas.appendChild(makeNode(e));
  select(e.id, null);
  saveDraft();
}

/* ───────── panel Mis mapas ───────── */
const panel = $('#maps-panel');
function renderMapsList(){
  const lib = loadLib();
  const list = $('#maps-list');
  if(!lib.length){
    list.innerHTML = '<div class="maps-empty">Aún no hay mapas guardados. Usa «Guardar» para añadir el actual.</div>';
    return;
  }
  list.innerHTML = '';
  lib.slice().sort((a, b) => (b.updated||0) - (a.updated||0)).forEach(m => {
    const row = document.createElement('div');
    row.className = 'map-row' + (m.id === state.id ? ' current' : '');
    const date = m.updated ? new Date(m.updated).toLocaleDateString('es-ES', {day:'numeric', month:'short'}) : '';
    row.innerHTML =
      '<span class="mn">' + escapeHtml(m.name || 'Sin nombre') + '</span>' +
      '<span class="md">' + m.elements.length + ' elem · ' + date + '</span>' +
      '<button class="mx" title="Borrar">✕</button>';
    row.addEventListener('click', ev => {
      if(ev.target.closest('.mx')){
        if(confirm('¿Borrar «' + (m.name || 'Sin nombre') + '» de Mis mapas?')){
          localStorage.setItem(LIB_KEY, JSON.stringify(loadLib().filter(x => x.id !== m.id)));
          renderMapsList();
        }
        return;
      }
      state = JSON.parse(JSON.stringify(m));
      syncSeq();
      select(null, null);
      $('#map-name').value = state.name || '';
      renderElements();
      applyBg();
      saveDraft();
      panel.classList.remove('open');
      toast('Mapa cargado');
    });
    list.appendChild(row);
  });
}
$('#btn-maps').addEventListener('click', () => {
  renderMapsList();
  panel.classList.add('open');
});
$('#maps-close').addEventListener('click', () => panel.classList.remove('open'));
panel.addEventListener('click', ev => {
  if(ev.target === panel) panel.classList.remove('open');
});
$('#maps-new').addEventListener('click', () => {
  if(!confirm('¿Empezar un mapa nuevo? Lo que no esté guardado se pierde.')) return;
  state = freshMap();
  idSeq = 2;
  select(null, null);
  $('#map-name').value = '';
  renderElements();
  applyBg();
  saveDraft();
  panel.classList.remove('open');
});

/* ───────── toast ───────── */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* lienzo cuadrado (lado = menor del área disponible) → proporciones reales */
/* lienzo cuadrado ANCLADO bajo las pestañas (sin huecos variables a su alrededor):
   se dimensiona al espacio que queda tras la zona de arriba y el alto NATURAL de
   los paneles de abajo; el espacio sobrante va al fondo de .below, no alrededor. */
function sizeCanvas(){
  const wrap = canvas.parentElement, cs = getComputedStyle(wrap);
  const below = document.getElementById('below');
  const availW = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  let topH = 0;
  [...app.children].forEach(c => {
    if(c === wrap || c === below) return;
    if(getComputedStyle(c).position === 'absolute') return;
    topH += c.offsetHeight;
  });
  let belowNat = 0;                                   // alto natural del contenido de abajo
  [...below.children].forEach(c => { belowNat += c.offsetHeight; });
  belowNat += 9;                                      // margen superior del panel de edición
  const availH = app.clientHeight - topH - belowNat - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const s = Math.max(150, Math.min(availW, availH));
  canvas.style.width = s + 'px';
  canvas.style.height = s + 'px';
}
function relayout(){ lockTabBodyHeight(); sizeCanvas(); }
window.addEventListener('resize', relayout);
window.addEventListener('load', relayout);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
